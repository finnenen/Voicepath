<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicepath Visualizer 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            perspective: 800px;
        }

        #ui-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        button {
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.7);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>Voicepath 3D</h1>
        <button id="start-btn">Mikrofon starten</button>
    </div>

    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const uiContainer = document.getElementById('ui-container');

        // Canvas an Fenstergröße anpassen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let audioContext;
        let analyser;
        let microphone;
        let dataArray;

        // 3D Positionen für flüssige Bewegungen
        let currentX = 0;
        let currentY = -200;
        let currentZ = 0;
        
        let targetX = 0;
        let targetY = -200;
        let targetZ = 0;

        let lastSpectralCentroid = 0;
        
        // Array für den leuchtenden 3D-Schweif
        const trail = [];
        const MAX_TRAIL_LENGTH = 150; // Länge der Achterbahn-Spur

        // Kamera-Setup (für den 3D-Raum)
        const fov = 600; // Sichtfeld (Zoom)
        const cameraTiltX = 0.3; // Neigung der Kamera nach unten (im Bogenmaß)
        const cameraYOffset = 300; // Kamera etwas anheben, um besser in die Tiefe zu blicken

        startBtn.addEventListener('click', async () => {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.8;
                
                microphone.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                uiContainer.style.opacity = '0';
                setTimeout(() => uiContainer.style.display = 'none', 500);
                
                draw();

            } catch (err) {
                alert('Fehler beim Zugriff auf das Mikrofon: ' + err.message);
                console.error(err);
            }
        });

        // Hilfsfunktion: 3D zu 2D Projektion (mit Kameraneigung)
        function project3D(x, y, z) {
            // Kamera-Offset anwenden
            y -= cameraYOffset;

            // Rotation um die X-Achse (Kameraneigung)
            const cosT = Math.cos(cameraTiltX);
            const sinT = Math.sin(cameraTiltX);
            const rotatedY = y * cosT - z * sinT;
            const rotatedZ = y * sinT + z * cosT;

            // Perspektivische Projektion
            const scale = fov / (fov + rotatedZ);
            const screenX = x * scale + canvas.width / 2;
            const screenY = rotatedY * scale + canvas.height / 2;
            
            return { x: screenX, y: screenY, scale: scale, z: rotatedZ };
        }

        function draw() {
            requestAnimationFrame(draw);

            // Canvas leeren für das neue Frame (komplett schwarz, der Schweif wird aus dem Array gezeichnet)
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Raster/Raum-Andeutung (optional, um Tiefe besser zu spüren)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = -1000; i <= 1000; i += 200) {
                let p1 = project3D(i, -300, 0);
                let p2 = project3D(i, -300, 2000);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                
                let p3 = project3D(-1000, -300, i > 0 ? i : 0);
                let p4 = project3D(1000, -300, i > 0 ? i : 0);
                ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
            }

            analyser.getByteFrequencyData(dataArray);

            let sumVolume = 0;
            let weightedSum = 0;
            let totalWeight = 0;
            const relevantBins = Math.min(150, dataArray.length);

            for (let i = 0; i < relevantBins; i++) {
                const amplitude = dataArray[i];
                sumVolume += amplitude;
                
                if (amplitude > 0) {
                    weightedSum += i * amplitude;
                    totalWeight += amplitude;
                }
            }

            const avgVolume = sumVolume / relevantBins;
            let spectralCentroid = 0;
            if (totalWeight > 0) {
                spectralCentroid = weightedSum / totalWeight;
            }

            // NEU: Berechnung der Schwankung (Z-Achse)
            // Wie stark hat sich die Tonhöhe im Vergleich zum letzten Frame verändert?
            const pitchDelta = Math.abs(spectralCentroid - lastSpectralCentroid);
            lastSpectralCentroid = spectralCentroid;

            if (avgVolume < 5) {
                // Bei Stille: Punkt fällt sanft nach unten und kommt nach vorne
                targetY = -300; 
                targetX = targetX * 0.95; // Zur Mitte gleiten
                targetZ = 0;
            } else {
                // X-Achse (Tonhöhe)
                const maxExpectedCentroid = 80; 
                let normalizedX = spectralCentroid / maxExpectedCentroid;
                normalizedX = Math.max(0, Math.min(1, normalizedX));
                targetX = (normalizedX - 0.5) * 1200; // Breite im 3D Raum von -600 bis +600

                // Y-Achse (Lautstärke)
                let normalizedY = avgVolume / 100;
                normalizedY = Math.max(0, Math.min(1, normalizedY));
                targetY = -300 + (normalizedY * 800); // Höhe im 3D Raum von -300 bis +500

                // Z-Achse (Ton-Schwankung)
                // Hohes Delta = tiefer in den Raum hineinspringen
                const targetDepth = pitchDelta * 300; // Multiplikator für die Empfindlichkeit
                targetZ = Math.min(targetDepth, 2500); // Maximal 2500 Einheiten in die Tiefe
            }

            // Lerp (Trägheit für sanfte Achterbahn-Bewegungen)
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            // Z-Achse etwas schneller reagieren lassen für knackigere Sprünge nach hinten
            currentZ += (targetZ - currentZ) * 0.15; 

            // Farbe basierend auf X- und Z-Achse leicht variieren
            const hue = ((currentX + 600) / 1200) * 360;
            
            // Aktuelle Position in den Trail-Array pushen
            trail.push({ x: currentX, y: currentY, z: currentZ, hue: hue });
            if (trail.length > MAX_TRAIL_LENGTH) {
                trail.shift();
            }

            // Trail (Achterbahn-Spur) zeichnen
            for (let i = 0; i < trail.length - 1; i++) {
                const point1 = trail[i];
                const point2 = trail[i + 1];

                // Trailpunkte bewegen sich langsam auf den Betrachter zu, damit es dynamischer wirkt (optional)
                point1.z -= 2;

                const proj1 = project3D(point1.x, point1.y, point1.z);
                const proj2 = project3D(point2.x, point2.y, point2.z);

                // Punkte hinter der Kamera nicht zeichnen
                if (proj1.z <= -fov || proj2.z <= -fov) continue;

                // Transparenz basierend auf dem Alter des Punktes im Array
                const alpha = (i / trail.length);
                const color = `hsla(${point1.hue}, 100%, 60%, ${alpha})`;

                ctx.beginPath();
                ctx.moveTo(proj1.x, proj1.y);
                ctx.lineTo(proj2.x, proj2.y);
                
                // Linienbreite basierend auf der Tiefe skalieren (Punkte vorne sind dicker)
                ctx.lineWidth = Math.max(0.5, 12 * proj1.scale * alpha);
                ctx.strokeStyle = color;
                
                ctx.shadowBlur = 10 * proj1.scale;
                ctx.shadowColor = `hsl(${point1.hue}, 100%, 60%)`;
                
                ctx.stroke();
            }

            // Den aktuellen vordersten "leuchtenden Kopf" zeichnen
            if (trail.length > 0) {
                const head = trail[trail.length - 1];
                const projHead = project3D(head.x, head.y, head.z);

                if (projHead.z > -fov) {
                    const headColor = `hsl(${head.hue}, 100%, 70%)`;
                    ctx.beginPath();
                    ctx.arc(projHead.x, projHead.y, Math.max(1, 15 * projHead.scale), 0, Math.PI * 2);
                    ctx.fillStyle = headColor;
                    ctx.shadowBlur = 30 * projHead.scale;
                    ctx.shadowColor = headColor;
                    ctx.fill();

                    // Weißer Kern
                    ctx.beginPath();
                    ctx.arc(projHead.x, projHead.y, Math.max(1, 5 * projHead.scale), 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 0;
                    ctx.fill();
                }
            }
        }
    </script>
</body>
</html>
