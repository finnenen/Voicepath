<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicepath Visualizer 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #ui-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        button {
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.7);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>Voicepath 3D</h1>
        <button id="start-btn">Mikrofon starten</button>
    </div>

    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const uiContainer = document.getElementById('ui-container');

        // Canvas an Fenstergröße anpassen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let audioContext;
        let analyser;
        let microphone;
        let dataArray;

        // Würfel-Halbgröße: Ton bleibt innerhalb ±BOX auf jeder Achse
        const BOX = 300;

        // Vogelgesang-Frequenzbereich in FFT-Bins
        // Bei fftSize=2048 und ~44100 Hz: jeder Bin ≈ 21,5 Hz
        // Vögel singen typisch ~970–6880 Hz → Bins ~45–320
        const BIRD_MIN_BIN = 45;
        const BIRD_MAX_BIN = 320;

        // Maximale erwartete Frequenzänderung pro Frame (in Bins) für Vogelgezwitscher
        // Schnelle Triller können 20–25 Bins/Frame erreichen; 22 deckt den typischen Bereich gut ab
        const MAX_PITCH_DELTA = 22;

        // Fixer Kamerawinkel – keine automatische Rotation
        const CAM_Y = Math.PI / 6;   // 30° horizontale Drehung (sieht alle 3 Achsen)
        const CAM_X = Math.PI / 7;   // ~26° nach unten geneigt
        const FOV = 680;

        // Aktuelle und Ziel-Position des Punktes
        let currentX = 0, currentY = -BOX, currentZ = -BOX;
        let targetX = 0,  targetY = -BOX, targetZ = -BOX;

        let lastSpectralCentroid = (BIRD_MIN_BIN + BIRD_MAX_BIN) / 2;

        // Schweif
        const trail = [];
        const MAX_TRAIL_LENGTH = 120;

        // 3D → 2D Projektion mit fixer Kamera (Y-Flip: oben = positiv)
        function project3D(x, y, z) {
            // Szene um Y-Achse drehen (horizontale Perspektive)
            const cosY = Math.cos(CAM_Y);
            const sinY = Math.sin(CAM_Y);
            const rx = x * cosY + z * sinY;
            const ry = y;
            const rz = -x * sinY + z * cosY;

            // Szene um X-Achse kippen (von oben schauen)
            const cosX = Math.cos(CAM_X);
            const sinX = Math.sin(CAM_X);
            const fx = rx;
            const fy = ry * cosX - rz * sinX;
            const fz = ry * sinX + rz * cosX;

            // Perspektivische Projektion
            const depth = FOV + fz;
            if (depth <= 1) return null;
            const scale = FOV / depth;
            return {
                x: fx * scale + canvas.width / 2,
                y: -fy * scale + canvas.height / 2,  // Y umkehren: oben = positiv
                scale: scale
            };
        }

        // Linie zwischen zwei 3D-Punkten zeichnen
        function drawLine3D(x1, y1, z1, x2, y2, z2, style, lineWidth) {
            const p1 = project3D(x1, y1, z1);
            const p2 = project3D(x2, y2, z2);
            if (!p1 || !p2) return;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = style;
            ctx.lineWidth = lineWidth || 1;
            ctx.stroke();
        }

        // Text an einer 3D-Position zeichnen (feste Schriftgröße für Lesbarkeit)
        function drawText3D(text, x, y, z, color, fontSize) {
            const p = project3D(x, y, z);
            if (!p) return;
            ctx.font = `bold ${fontSize || 13}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 6;
            ctx.shadowColor = color;
            ctx.fillText(text, p.x, p.y);
            ctx.shadowBlur = 0;
        }

        // Würfelrahmen (12 Kanten)
        function drawBox() {
            const B = BOX;
            const style = 'rgba(255,255,255,0.2)';
            // Vordere Fläche (z = -B)
            drawLine3D(-B, -B, -B,  B, -B, -B, style);
            drawLine3D( B, -B, -B,  B,  B, -B, style);
            drawLine3D( B,  B, -B, -B,  B, -B, style);
            drawLine3D(-B,  B, -B, -B, -B, -B, style);
            // Hintere Fläche (z = +B)
            drawLine3D(-B, -B,  B,  B, -B,  B, style);
            drawLine3D( B, -B,  B,  B,  B,  B, style);
            drawLine3D( B,  B,  B, -B,  B,  B, style);
            drawLine3D(-B,  B,  B, -B, -B,  B, style);
            // Verbindungskanten
            drawLine3D(-B, -B, -B, -B, -B,  B, style);
            drawLine3D( B, -B, -B,  B, -B,  B, style);
            drawLine3D( B,  B, -B,  B,  B,  B, style);
            drawLine3D(-B,  B, -B, -B,  B,  B, style);
        }

        // Farbige Achsen mit Beschriftungen
        function drawAxes() {
            const B = BOX;
            const EXT = B + 55; // Achse etwas über den Würfel hinaus verlängern

            ctx.shadowBlur = 0;

            // X-Achse – Frequenz (cyan)
            drawLine3D(-EXT, 0, 0, EXT, 0, 0, '#00ffcc', 1.5);
            drawText3D('Frequenz →', EXT + 15, 0, 0, '#00ffcc', 13);
            drawText3D('tief', -EXT - 10, 0, 0, '#00ffcc', 11);

            // Y-Achse – Lautstärke (gelb)
            drawLine3D(0, -EXT, 0, 0, EXT, 0, '#ffcc00', 1.5);
            drawText3D('Lautstärke ↑', 0, EXT + 18, 0, '#ffcc00', 13);
            drawText3D('leise', 0, -EXT - 10, 0, '#ffcc00', 11);

            // Z-Achse – Variation (magenta)
            drawLine3D(0, 0, -EXT, 0, 0, EXT, '#ff66cc', 1.5);
            drawText3D('Variation', 0, 0, EXT + 20, '#ff66cc', 13);
            drawText3D('stabil', 0, 0, -EXT - 15, '#ff66cc', 11);
        }

        // Subtiles Bodenraster (Y = -BOX) für räumliche Orientierung
        function drawFloorGrid() {
            const B = BOX;
            const steps = 4;
            const step = (2 * B) / steps;
            for (let i = 1; i < steps; i++) {
                const o = -B + i * step;
                drawLine3D( o, -B, -B,  o, -B,  B, 'rgba(255,255,255,0.07)');
                drawLine3D(-B, -B,  o,  B, -B,  o, 'rgba(255,255,255,0.07)');
            }
        }

        startBtn.addEventListener('click', async () => {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.75;
                microphone.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                uiContainer.style.opacity = '0';
                setTimeout(() => uiContainer.style.display = 'none', 500);

                draw();
            } catch (err) {
                alert('Fehler beim Zugriff auf das Mikrofon: ' + err.message);
                console.error(err);
            }
        });

        function draw() {
            requestAnimationFrame(draw);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.shadowBlur = 0;
            drawBox();
            drawFloorGrid();
            drawAxes();

            // Audio-Daten auswerten (nur Vogelgesang-Frequenzbereich)
            analyser.getByteFrequencyData(dataArray);

            let sumVolume = 0;
            let weightedSum = 0;
            let totalWeight = 0;

            for (let i = BIRD_MIN_BIN; i <= BIRD_MAX_BIN; i++) {
                const amp = dataArray[i];
                sumVolume += amp;
                if (amp > 0) {
                    weightedSum += i * amp;
                    totalWeight += amp;
                }
            }

            const binCount = BIRD_MAX_BIN - BIRD_MIN_BIN + 1;
            const avgVolume = sumVolume / binCount;
            let spectralCentroid = (BIRD_MIN_BIN + BIRD_MAX_BIN) / 2;
            if (totalWeight > 0) {
                spectralCentroid = weightedSum / totalWeight;
            }

            // Pitch-Variation (Z-Achse): wie schnell ändert sich die Tonhöhe?
            const pitchDelta = Math.abs(spectralCentroid - lastSpectralCentroid);
            lastSpectralCentroid = spectralCentroid;

            if (avgVolume < 3) {
                // Stille: langsam zurück zur Ruheposition
                targetX += (0 - targetX) * 0.04;
                targetY = -BOX;
                targetZ += (-BOX - targetZ) * 0.04;
            } else {
                // X-Achse: spektraler Schwerpunkt → Tonhöhe/-farbe
                // Vogelbereich: BIRD_MIN_BIN … BIRD_MAX_BIN → -BOX … +BOX
                const normX = (spectralCentroid - BIRD_MIN_BIN) / (BIRD_MAX_BIN - BIRD_MIN_BIN);
                targetX = Math.max(-BOX, Math.min(BOX, (normX - 0.5) * 2 * BOX));

                // Y-Achse: Lautstärke (0–100 → -BOX … +BOX)
                // Typische Vogelrufe erreichen avgVolume ≈ 20–80 im Vogelbereich
                const normY = Math.min(1, avgVolume / 80);
                targetY = Math.max(-BOX, Math.min(BOX, normY * 2 * BOX - BOX));

                // Z-Achse: Frequenzvariation (0–25 Bins/Frame → -BOX … +BOX)
                // Vogelgezwitscher hat oft schnelle Frequenzsprünge
                const normZ = Math.min(1, pitchDelta / MAX_PITCH_DELTA);
                targetZ = Math.max(-BOX, Math.min(BOX, normZ * 2 * BOX - BOX));
            }

            // Sanfte Interpolation (Trägheit)
            currentX += (targetX - currentX) * 0.12;
            currentY += (targetY - currentY) * 0.12;
            currentZ += (targetZ - currentZ) * 0.18;

            // Farbe nach Position im Vogelfrequenzbereich (cyan → gelb → magenta)
            const hue = ((currentX + BOX) / (2 * BOX)) * 200 + 140;

            // Schweif aufzeichnen (keine z-Drift mehr, Position bleibt stabil)
            trail.push({ x: currentX, y: currentY, z: currentZ, hue: hue });
            if (trail.length > MAX_TRAIL_LENGTH) trail.shift();

            // Schweif zeichnen
            for (let i = 1; i < trail.length; i++) {
                const p1 = trail[i - 1];
                const p2 = trail[i];
                const proj1 = project3D(p1.x, p1.y, p1.z);
                const proj2 = project3D(p2.x, p2.y, p2.z);
                if (!proj1 || !proj2) continue;

                const alpha = i / trail.length;
                ctx.beginPath();
                ctx.moveTo(proj1.x, proj1.y);
                ctx.lineTo(proj2.x, proj2.y);
                ctx.strokeStyle = `hsla(${p1.hue}, 100%, 65%, ${alpha * 0.9})`;
                ctx.lineWidth = Math.max(0.5, 10 * proj1.scale * alpha);
                ctx.shadowBlur = 8 * proj1.scale;
                ctx.shadowColor = `hsl(${p1.hue}, 100%, 65%)`;
                ctx.stroke();
            }

            // Leuchtender Kopf (aktueller Tonpunkt)
            if (trail.length > 0) {
                const head = trail[trail.length - 1];
                const ph = project3D(head.x, head.y, head.z);
                if (ph) {
                    const headColor = `hsl(${head.hue}, 100%, 70%)`;
                    ctx.shadowBlur = 25 * ph.scale;
                    ctx.shadowColor = headColor;
                    ctx.beginPath();
                    ctx.arc(ph.x, ph.y, Math.max(2, 14 * ph.scale), 0, Math.PI * 2);
                    ctx.fillStyle = headColor;
                    ctx.fill();

                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(ph.x, ph.y, Math.max(1, 4 * ph.scale), 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }
            }
        }
    </script>
</body>
</html>
